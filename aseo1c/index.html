<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aseo TI1C - Octubre 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --utt-green: #00563f;
            --utt-green-dark: #003828;
            --utt-green-light: #00875a;
            --utt-accent: #00c97a;
            --utt-gold: #d4af37;
            --bg: #f0f4f2;
            --card: #ffffff;
            --text: #0f2b1f;
            --muted: #6b7f74;
            --border: #d4e5dc;
            --today-bg: #fff8e1;
            --today-border: #f59e0b;
            --today-glow: rgba(245,158,11,0.25);
            --empty-bg: #f7faf8;
            --shadow: 0 2px 10px rgba(0,86,63,0.08);
            --shadow-hover: 0 6px 20px rgba(0,86,63,0.16);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px 16px 48px;
        }

        /* HEADER */
        .page-header {
            background: linear-gradient(135deg, var(--utt-green-dark) 0%, var(--utt-green) 100%);
            border-radius: 16px;
            padding: 22px 28px;
            margin-bottom: 28px;
            color: white;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 6px 24px rgba(0,56,40,0.3);
        }

        .header-icon {
            width: 56px; height: 56px;
            background: rgba(255,255,255,0.15);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        .header-text h1 {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        .header-text p {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-top: 3px;
        }

        .header-badge {
            margin-left: auto;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 10px;
            padding: 8px 16px;
            text-align: center;
            flex-shrink: 0;
        }
        .header-badge .badge-num {
            font-size: 1.6rem;
            font-weight: 900;
            line-height: 1;
        }
        .header-badge .badge-label {
            font-size: 0.7rem;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* TODAY BANNER */
        #today-banner {
            background: linear-gradient(135deg, #fff3cd, #fffbea);
            border: 2px solid var(--today-border);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 14px;
            box-shadow: 0 4px 16px var(--today-glow);
        }
        .banner-icon {
            width: 42px; height: 42px;
            background: var(--today-border);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        #today-banner strong { color: #92400e; font-weight: 800; }
        #today-banner p { color: #78350f; font-size: 0.88rem; line-height: 1.4; }

        /* WEEKDAY LABELS */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .day-header {
            text-align: center;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--utt-green);
            padding: 8px 0;
            border-bottom: 2px solid var(--utt-green-light);
            margin-bottom: 4px;
        }

        /* DAY CARD */
        .day-card {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            min-height: 140px;
            position: relative;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .day-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .day-card.empty {
            background: var(--empty-bg);
            border-color: transparent;
            box-shadow: none;
        }
        .day-card.empty:hover { transform: none; }

        .day-card.today {
            background: var(--today-bg);
            border: 2.5px solid var(--today-border);
            box-shadow: 0 0 0 4px var(--today-glow), var(--shadow-hover);
        }

        .day-num {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--utt-green-dark);
            line-height: 1;
            margin-bottom: 3px;
        }

        .day-card.today .day-num {
            color: #92400e;
        }

        .today-chip {
            display: inline-block;
            background: var(--today-border);
            color: white;
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .weekday-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, var(--utt-green-light), transparent);
            border-radius: 1px;
            margin: 8px 0;
        }
        .day-card.today .divider {
            background: linear-gradient(90deg, var(--today-border), transparent);
        }

        .student-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .student-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.2;
        }

        .student-dot {
            width: 6px; height: 6px;
            background: var(--utt-green-light);
            border-radius: 50%;
            flex-shrink: 0;
        }
        .day-card.today .student-dot {
            background: var(--today-border);
        }

        .aseo-icon {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 1rem;
            opacity: 0.15;
        }
        .day-card.today .aseo-icon { opacity: 0.3; }

        /* FOOTER */
        .cal-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.78rem;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--muted);
        }
        .legend-dot {
            width: 12px; height: 12px;
            border-radius: 4px;
        }

        @media (max-width: 700px) {
            .cal-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .day-card { min-height: 110px; padding: 10px; }
            .day-num { font-size: 1.2rem; }
            .page-header { flex-direction: column; text-align: center; }
            .header-badge { margin: 0 auto; }
        }
        @media (max-width: 420px) {
            .cal-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="page-header">
        <div class="header-icon">&#129529;</div>
        <div class="header-text">
            <h1>Calendario de Aseo</h1>
            <p>Grupo TI1C &bull; Octubre 2026 &bull; UTTN</p>
        </div>
        <div class="header-badge">
            <div class="badge-num">22</div>
            <div class="badge-label">turnos</div>
        </div>
    </div>

    <!-- TODAY BANNER -->
    <div id="today-banner">
        <div class="banner-icon"><i class="fa-solid fa-broom"></i></div>
        <div>
            <strong>&#128197; Hoy toca aseo</strong>
            <p id="banner-text">...</p>
        </div>
    </div>

    <!-- CALENDAR GRID -->
    <div class="cal-grid">
        <div class="day-header">Lunes</div>
        <div class="day-header">Martes</div>
        <div class="day-header">Mi&eacute;rcoles</div>
        <div class="day-header">Jueves</div>
        <div class="day-header">Viernes</div>
    </div>

    <div class="cal-grid" id="calendar-body"></div>

    <!-- LEGEND -->
    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot" style="background:var(--utt-green-light);"></div>
            D&iacute;a con aseo asignado
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:var(--today-border);"></div>
            Hoy
        </div>
    </div>

    <!-- FOOTER -->
    <div class="cal-footer">
        <div>Calendario de Aseo &bull; Grupo TI1C &bull; UTTN Octubre 2026</div>
        <div>Creado por <strong>JE-Productions</strong> &bull; Herramienta No Oficial</div>
    </div>

    <script>
    // Schedule data from PDF (October 2026)
    const ASEO = [
        { day: 1,  wd: 'J',  students: ['Reyna Campos', 'Jehiel Castañeda', 'Alexis Velázquez'] },
        { day: 2,  wd: 'V',  students: ['Luis Cruz', 'Nancy Florencia', 'Emmanuel Hernández'] },
        { day: 5,  wd: 'L',  students: ['Rosse Meza', 'Alan Morales', 'Ethan Volcan'] },
        { day: 6,  wd: 'M',  students: ['Asael Hernández', 'Aron Iñiguez', 'Brayan López'] },
        { day: 7,  wd: 'Mi', students: ['Jair García', 'Josue Peque', 'Maximiliano Santana'] },
        { day: 8,  wd: 'J',  students: ['Lidia Mtz', 'Angel Mateos', 'Isabela Olarte'] },
        { day: 9,  wd: 'V',  students: ['Abigail Ostos', 'Eduardo Perez', 'Ximena Reyes'] },
        { day: 12, wd: 'L',  students: ['Alberto Gamez', 'Lesly Gonzalez', 'Alfredo Sosa'] },
        { day: 13, wd: 'M',  students: ['Dylan Rosales', 'Kimberly Castillo', 'Frida Varela'] },
        { day: 14, wd: 'Mi', students: ['Gael Amaya', 'Regina Avalos', 'Derek Bernadi'] },
        { day: 15, wd: 'J',  students: ['Reyna Campos', 'Jehiel Castañeda', 'Alexis Velázquez'] },
        { day: 16, wd: 'V',  students: ['Luis Cruz', 'Nancy Florencia', 'Emmanuel Hernández'] },
        { day: 19, wd: 'L',  students: ['Rosse Meza', 'Alan Morales', 'Ethan Volcan'] },
        { day: 20, wd: 'M',  students: ['Asael Hernández', 'Aron Iñiguez', 'Brayan López'] },
        { day: 21, wd: 'Mi', students: ['Jair García', 'Josue Peque', 'Maximiliano Santana'] },
        { day: 22, wd: 'J',  students: ['Lidia Mtz', 'Angel Mateos', 'Isabela Olarte'] },
        { day: 23, wd: 'V',  students: ['Abigail Ostos', 'Eduardo Perez', 'Ximena Reyes'] },
        { day: 26, wd: 'L',  students: ['Alberto Gamez', 'Lesly Gonzalez', 'Alfredo Sosa'] },
        { day: 27, wd: 'M',  students: ['Dylan Rosales', 'Kimberly Castillo', 'Frida Varela'] },
        { day: 28, wd: 'Mi', students: ['Gael Amaya', 'Regina Avalos', 'Derek Bernadi'] },
        { day: 29, wd: 'J',  students: ['Reyna Campos', 'Jehiel Castañeda', 'Alexis Velázquez'] },
        { day: 30, wd: 'V',  students: ['Luis Cruz', 'Nancy Florencia', 'Emmanuel Hernández'] },
    ];

    const WD_NAMES = { L:'Lunes', M:'Martes', Mi:'Miercoles', J:'Jueves', V:'Viernes' };

    const aseoMap = {};
    ASEO.forEach(a => { aseoMap[a.day] = a; });

    const today = new Date();
    // Check if current month is October 2026 (Month index 9)
    const todayDay = (today.getMonth() === 9 && today.getFullYear() === 2026) ? today.getDate() : (today.getMonth() === 9 ? today.getDate() : today.getDate());

    const weekdayLabels = ['L','M','Mi','J','V'];

    // Oct 1 2026 is a Thursday (col index 3: Mon=0, Tue=1, Wed=2, Thu=3, Fri=4)
    const oct1dow = 3;

    const gridCells = [];
    // Spacers for Mon, Tue, Wed before Oct 1
    for (let i = 0; i < oct1dow; i++) {
        gridCells.push({ empty: true, label: '' });
    }

    for (let d = 1; d <= 31; d++) {
        const dow = (oct1dow + d - 1) % 7; // 0=Mon..4=Fri, 5=Sat, 6=Sun
        if (dow === 5 || dow === 6) continue; // Skip weekends
        const entry = aseoMap[d] || null;
        gridCells.push({ empty: false, day: d, col: dow, entry, wd: weekdayLabels[dow] });
    }

    const body = document.getElementById('calendar-body');

    gridCells.forEach(cell => {
        const div = document.createElement('div');

        if (cell.empty) {
            div.className = 'day-card empty';
            body.appendChild(div);
            return;
        }

        const isToday = cell.day === todayDay;
        div.className = 'day-card' + (isToday ? ' today' : '');

        let studentsHTML = '';
        if (cell.entry) {
            studentsHTML = '<ul class="student-list">' +
                cell.entry.students.map(s =>
                    '<li class="student-item"><span class="student-dot"></span>' + s + '</li>'
                ).join('') +
                '</ul>';
        } else {
            studentsHTML = '<span style="font-size:0.75rem;color:var(--muted);font-style:italic;">Sin asignacion</span>';
        }

        div.innerHTML =
            '<i class="fa-solid fa-broom aseo-icon"></i>' +
            (isToday ? '<div class="today-chip">HOY</div>' : '') +
            '<div class="day-num">' + cell.day + '</div>' +
            '<div class="weekday-label">' + WD_NAMES[cell.wd] + '</div>' +
            '<div class="divider"></div>' +
            studentsHTML;

        body.appendChild(div);

        if (isToday && cell.entry) {
            const banner = document.getElementById('today-banner');
            banner.style.display = 'flex';
            document.getElementById('banner-text').innerHTML =
                'Hoy, <strong>' + WD_NAMES[cell.wd] + ' ' + cell.day + ' de octubre</strong>, les corresponde aseo a: <strong>' +
                cell.entry.students.join(', ') + '</strong>.';
        }
    });
    </script>
</body>
</html>
